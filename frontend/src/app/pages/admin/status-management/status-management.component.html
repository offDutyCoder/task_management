<mat-card>
  <mat-card-header>
    <mat-card-title>ステータス管理</mat-card-title>
    <span class="spacer"></span>
    <button
      mat-raised-button
      color="primary"
      (click)="openCreateDialog()"
      data-testid="create-status-button"
    >
      <mat-icon>add</mat-icon>
      新規ステータス
    </button>
  </mat-card-header>

  <mat-card-content>
    @if (isLoading()) {
      <div class="loading-container">
        <mat-spinner diameter="40" />
      </div>
    } @else {
      <table mat-table [dataSource]="statuses()" class="full-width">
        <ng-container matColumnDef="color">
          <th mat-header-cell *matHeaderCellDef>色</th>
          <td mat-cell *matCellDef="let status">
            <span class="color-badge" [style.background-color]="status.color"></span>
            <span class="color-code">{{ status.color }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>名前</th>
          <td mat-cell *matCellDef="let status">{{ status.name }}</td>
        </ng-container>

        <ng-container matColumnDef="displayOrder">
          <th mat-header-cell *matHeaderCellDef>表示順</th>
          <td mat-cell *matCellDef="let status">{{ status.displayOrder }}</td>
        </ng-container>

        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef>状態</th>
          <td mat-cell *matCellDef="let status">
            <span [class]="status.isActive ? 'status-active' : 'status-inactive'">
              {{ status.isActive ? '有効' : '無効' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>操作</th>
          <td mat-cell *matCellDef="let status">
            <button
              mat-icon-button
              color="primary"
              (click)="openEditDialog(status)"
              [attr.aria-label]="status.name + 'を編集'"
              data-testid="edit-status-button"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="deleteStatus(status)"
              [attr.aria-label]="status.name + 'を削除'"
              data-testid="delete-status-button"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    }
  </mat-card-content>
</mat-card>
